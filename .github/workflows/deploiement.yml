name: Deploiement

# Ce qui est sur `main` finit sur le NAS, sans geste manuel.
#
# ─── Le chemin, en entier ────────────────────────────────────────────────
#   push sur main  →  tests backend + contrôles web  →  images publiées sur
#   GHCR  →  Watchtower, sur le NAS, les récupère et redémarre.
#
# Le NAS ne compile rien et n'expose rien : il VA CHERCHER (voir
# backend/docker-compose.nas.yml). Aucun port entrant, aucun agent GitHub, et
# rien à ouvrir sur la box - ce que ni un runner auto-hébergé ni un SSH depuis
# GitHub n'auraient permis de dire.
#
# ─── Pourquoi les tests sont ICI et pas dans un workflow voisin ──────────
# « Déployer main » n'a de sens que si main est digne de confiance. Un
# workflow de publication séparé aurait dû attendre le résultat des autres,
# et GitHub ne sait le faire proprement qu'avec `workflow_run` - qui ne se
# déclenche pas quand le workflow attendu a été SAUTÉ par un filtre de
# chemins. Un push touchant seulement le web n'aurait donc rien attendu du
# tout. Les deux portes vivent donc dans ce fichier, en amont de la
# publication, et `needs:` garantit qu'aucune image ne part si l'une refuse.
#
# ─── Ce que ce workflow ne fait PAS ──────────────────────────────────────
# Il ne sauvegarde pas la base. Les migrations Flyway s'appliquent au
# démarrage de l'API, donc automatiquement : une migration fautive part en
# production sans que personne ne l'ait relue ce jour-là. La sauvegarde reste
# le geste manuel décrit dans docs/EXPLOITATION.md, et elle compte davantage
# depuis que ce fichier existe.

on:
  push:
    branches: [main]
  # Pour rejouer un déploiement sans rien changer au code - typiquement après
  # avoir corrigé le .env du NAS.
  workflow_dispatch:

# Deux pushes rapprochés ne doivent pas publier dans le désordre : le second
# annule le premier, et c'est bien le dernier état de main qui gagne.
concurrency:
  group: deploiement
  cancel-in-progress: true

env:
  REGISTRE: ghcr.io

jobs:
  # ─────────────────────────────────────────────── Porte 1 : le backend
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers a besoin du démon Docker, présent nativement sur les
      # runners GitHub (pas de montage Docker-in-Docker comme en local).
      - name: mvn test
        run: mvn -B test

  # ─────────────────────────────────────────────────── Porte 2 : le web
  #
  # Ces contrôles ne tournaient NULLE PART en intégration continue jusqu'ici :
  # le seul workflow existant filtrait sur `backend/**`. Un push ne touchant
  # que le web n'était donc vérifié par personne - acceptable tant qu'un
  # humain déployait à la main, plus du tout maintenant.
  web:
    name: Contrôles web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # `tsc -b --noEmit` et non `npx tsc --noEmit` : ce dépôt est en mode
      # projets TypeScript, et la seconde forme ne vérifie rien du tout.
      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Le contraste AA est une règle de ce projet, pas un conseil : elle se
      # casse en changeant une couleur, ce qu'aucun test ne verrait.
      - name: Contraste
        run: npm run check:contrast

      - name: Build
        run: npm run build

  # ────────────────────────────────────────── Publication des deux images
  publier:
    name: Publier les images
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Écrire dans GHCR au nom du dépôt, avec le jeton fourni par GitHub :
      # aucun secret à créer, et rien à faire tourner de plus.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Les deux images portent `latest` ET le SHA du commit. `latest` est ce
      # que le NAS suit ; le SHA est ce qui permet de revenir en arrière à la
      # main quand une version passe mal, sans rien reconstruire.
      #
      # Le nom du dépôt est mis en minuscules : GHCR les exige, et
      # `RomainCharpentier/iozycore` n'en est pas.
      - name: Nom du dépôt en minuscules
        id: depot
        run: echo "nom=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # Le SHA est grave DANS l'image, et c'est le meme que son etiquette :
          # ce que l'app affiche se retrouve tel quel dans GHCR et sur GitHub.
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.nom }}-api:latest
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.nom }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.nom }}-web:latest
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.nom }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ──────────────────────────────────────────────────────────── Ménage
  #
  # Un dépôt PRIVÉ n'a que 500 Mo de stockage de paquets sur le plan gratuit,
  # et chaque publication y ajoute une couche (le jar fait ~60 Mo). Sans ce
  # ménage, le quota est atteint en une poignée de déploiements et les pushes
  # suivants échouent - sur une erreur de quota qui ne dit pas qu'elle vient
  # d'un historique d'images que personne ne relira jamais.
  #
  # Les cinq dernières versions suffisent à revenir en arrière ; au-delà, on
  # reconstruit depuis un SHA, ce qui est de toute façon plus sûr.
  menage:
    name: Purger les vieilles images
    needs: publier
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        paquet: [iozycore-api, iozycore-web]
    steps:
      - name: Ne garder que les 5 dernières
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.paquet }}
          package-type: container
          # Les 5 plus récentes sont gardées, les plus anciennes partent.
          # `latest` pointe toujours vers la plus récente : il n'est donc
          # jamais dans le lot supprimé.
          min-versions-to-keep: 5
