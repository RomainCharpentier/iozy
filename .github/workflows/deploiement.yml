name: Deploiement

# What is on `main` ends up on the NAS, with no manual step.
#
# ─── The whole path ──────────────────────────────────────────────────────
#   push on main  →  backend tests + web checks  →  images published on
#   GHCR  →  Watchtower, on the NAS, pulls them and restarts.
#
# The NAS builds nothing and exposes nothing: it FETCHES (see
# backend/docker-compose.nas.yml). No incoming port, no GitHub agent, and
# nothing to open on the box - which neither a self-hosted runner nor SSH from
# GitHub would have allowed us to say.
#
# ─── Why the tests are HERE and not in a neighbouring workflow ───────────
# "Deploy main" only makes sense if main can be trusted. A separate
# publish workflow would have had to wait for the result of the others,
# and GitHub only knows how to do that cleanly with `workflow_run` - which does not
# fire when the awaited workflow was SKIPPED by a path
# filter. A push touching only the web would then have waited for nothing at
# all. So both gates live in this file, upstream of the
# publication, and `needs:` guarantees that no image leaves if one refuses.
#
# ─── What this workflow does NOT do ──────────────────────────────────────
# It does not back up the database. The Flyway migrations are applied at the
# start of the API, so automatically: a faulty migration goes to
# production without anyone having re-read it that day. The backup stays
# the manual step described in docs/EXPLOITATION.md, and it matters more
# since this file exists.

on:
  push:
    branches: [main]
  # To replay a deployment without changing anything in the code - typically after
  # fixing the .env of the NAS.
  workflow_dispatch:

# Two pushes close together must not publish out of order: the second
# cancels the first, and it is the last state of main that wins.
concurrency:
  group: deploiement
  cancel-in-progress: true

env:
  REGISTRE: ghcr.io

jobs:
  # ─────────────────────────────────────────────── Gate 1: the backend
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers needs the Docker daemon, present natively on the
      # GitHub runners (no Docker-in-Docker mount like locally).
      - name: mvn test
        run: mvn -B test

  # ─────────────────────────────────────────────────── Gate 2: the web
  #
  # These checks ran NOWHERE in continuous integration until now:
  # the only existing workflow filtered on `backend/**`. A push touching
  # only the web was therefore checked by nobody - acceptable as long as a
  # human deployed by hand, not at all now.
  web:
    name: Contrôles web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # `tsc -b --noEmit` and not `npx tsc --noEmit`: this repository is in
      # TypeScript project mode, and the second form checks nothing at all.
      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # AA contrast is a rule of this project, not advice: it breaks when a
      # colour changes, which no test would see.
      - name: Contrast
        run: npm run check:contrast

      - name: Build
        run: npm run build

  # ────────────────────────────────────────── Publishing the two images
  kit:
    name: Charte IozyKit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iozykit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Regenerates css/tokens.css and checks every colour pair (AA): a
      # charter change that breaks a contrast stops the release here.
      - run: npm test

  iozyplay:
    name: Contrôles IozyPlay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iozyplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: iozyplay/package-lock.json
      - run: npm ci
      - name: Build (typecheck, then vite)
        run: npm run build
      - name: Tests serveur
        run: npm test
      - name: Tests unitaires
        run: npm run test:unit

  publier:
    name: Publier les images
    needs: [backend, web, kit, iozyplay]
    runs-on: ubuntu-latest
    permissions:
      # Put the `vX.Y.Z` tag on the released commit: it is what links
      # the number shown on screen to the code that is running, AND the starting
      # point of the calculation of the next release.
      contents: write
      # Write to GHCR on behalf of the repository, with the token given by GitHub:
      # no secret to create, and nothing more to run.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The calculation needs the WHOLE history and the tags: the default clone
          # takes only one commit and no tag. Without this, the
          # script fails rather than invent a number - a wrong number
          # reads exactly like a right one.
          fetch-depth: 0

      # ─── The release number ───────────────────────────────────────
      #
      # Major.Minor.Patch, WORKED OUT from the commit messages: the rule and its
      # tests live in web/scripts/version.mjs. No step to take, so
      # nothing to forget - and the number says what changed, not only that it
      # changed. It can also be compared, which a SHA never can: "server
      # 1.2.0" under "version 1.3.1" reads at a glance.
      #
      # `node` is present on the GitHub runners without installing anything.
      #
      # The assignment in two steps is deliberate: `echo "x=$(cmd)"` hides
      # the failure of `cmd` behind the success of `echo`, and would publish an
      # EMPTY version. An assignment takes the status of the command, and
      # `bash -e` stops there.
      - name: Number the release
        id: livraison
        run: |
          numero=$(node web/scripts/version.mjs)
          [ -n "$numero" ] || { echo "Empty version number" >&2; exit 1; }
          echo "numero=$numero" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Both images carry `latest` AND `vX.Y.Z`. `latest` is what the
      # NAS follows; the number is what lets you go back by hand
      # when a version goes badly, without rebuilding anything - and it is the one
      # that the application shows at the bottom of its pages.
      #
      # The SHA is no longer used as an image tag: two would have to be remembered
      # where a single number is enough, and the git tag `vX.Y.Z` set below
      # leads from this number to the exact commit.
      #
      # The repository name is put in lower case: GHCR requires it, and
      # `RomainCharpentier/iozycore` is not.
      - name: Repository name in lower case
        id: depot
        run: |
          echo "nom=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "proprietaire=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # IozyPlay has its own number, the one of its package.json: its commits
      # do not move the IozyCore release (see web/scripts/version.mjs).
      - name: IozyPlay version
        id: iozyplay
        run: |
          numero=$(node -p "require('./iozyplay/package.json').version")
          [ -n "$numero" ] || { echo "Empty IozyPlay version" >&2; exit 1; }
          echo "numero=$numero" >> "$GITHUB_OUTPUT"

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # The number is written INTO the image, and it is the same as its
          # tag: what the app shows is found as is in GHCR, and
          # on a git tag that points to the commit.
          build-args: VERSION=${{ steps.livraison.outputs.numero }}
          tags: |
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.nom }}-api:latest
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.nom }}-api:v${{ steps.livraison.outputs.numero }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Context = the repository root: the web and IozyPlay images need the
      # sibling iozykit/ (see their Dockerfile).
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: VERSION=${{ steps.livraison.outputs.numero }}
          tags: |
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.nom }}-web:latest
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.nom }}-web:v${{ steps.livraison.outputs.numero }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # One container for IozyPlay: front, API and Socket.IO under /play (see
      # iozyplay/Dockerfile). The NAS compose follows `latest` like the others.
      - name: IozyPlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: iozyplay/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.proprietaire }}/iozyplay:latest
            ${{ env.REGISTRE }}/${{ steps.depot.outputs.proprietaire }}/iozyplay:v${{ steps.iozyplay.outputs.numero }}
          cache-from: type=gha,scope=iozyplay
          cache-to: type=gha,mode=max,scope=iozyplay

      # ─── What links the number to the code ────────────────────────
      #
      # A displayed number is only worth something if you can go back to what it
      # points to. `v1.3.1` is a git tag: it can be read on GitHub,
      # `git show v1.3.1` resolves it, and it is the one that the calculation of
      # the next release reads - not setting it would make the next
      # version be calculated from an out-of-date base.
      #
      # Set AFTER the publication, on purpose: a tag means
      # "this release has left", never "we tried to publish it".
      #
      # Replaying the workflow on the same commit (`workflow_dispatch`, after a
      # fix of the .env of the NAS) lands on a number that is already tagged. We
      # then set nothing again, rather than make a deployment fail for a
      # tag that already tells the truth.
      - name: Tag the released commit
        env:
          ETIQUETTE: v${{ steps.livraison.outputs.numero }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$ETIQUETTE" >/dev/null 2>&1; then
            echo "$ETIQUETTE already exists: same release replayed, nothing to set."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$ETIQUETTE" -m "Version ${{ steps.livraison.outputs.numero }}"
          git push origin "$ETIQUETTE"

  # ──────────────────────────────────────────────────────────── Cleanup
  #
  # A PRIVATE repository only has 500 MB of package storage on the free plan,
  # and each publication adds a layer (the jar is ~60 MB). Without this
  # cleanup, the quota is reached in a handful of deployments and the following
  # pushes fail - on a quota error that does not say it comes
  # from a history of images that nobody will ever re-read.
  #
  # The last five versions are enough to go back; beyond that, we
  # rebuild from the `vX.Y.Z` tag of the commit, which is anyway
  # safer.
  menage:
    name: Purger les vieilles images
    needs: publier
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        paquet: [iozycore-api, iozycore-web, iozyplay]
    steps:
      - name: Keep only the last 5
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.paquet }}
          package-type: container
          # The 5 most recent are kept, the oldest go.
          # `latest` always points to the most recent: it is therefore
          # never in the deleted batch.
          min-versions-to-keep: 5
