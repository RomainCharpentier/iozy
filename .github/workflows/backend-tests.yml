name: Backend tests

# La porte des BRANCHES. Sur `main`, c'est le workflow de déploiement qui
# rejoue cette même suite, juste avant de publier les images : la laisser ici
# aussi ferait tourner deux fois 1099 tests par push - une dizaine de minutes
# de runner facturées pour deux fois la même réponse (dépôt privé).
#
# Testcontainers a besoin du démon Docker, disponible nativement sur les
# runners GitHub-hosted - pas besoin du montage « Docker-in-Docker » utilisé
# en local, voir backend/README.md section 3.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  # Déclenchement manuel avec filtre optionnel (utile pour isoler un test
  # flaky sans installer Java/Maven en local, ex: -Dtest=Xxx#method).
  workflow_dispatch:
    inputs:
      maven_args:
        description: "Arguments mvn (défaut : test)"
        required: false
        default: "test"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn test (unitaires + intégration Testcontainers)
        run: mvn -B ${{ github.event.inputs.maven_args || 'test' }}
