name: Backend tests

# The gate for BRANCHES. On `main`, the deploy workflow runs this same suite
# again, just before it publishes the images: leaving it here too would run
# 1099 tests twice per push - about ten minutes of runner time billed for the
# same answer twice (private repository).
#
# Testcontainers needs the Docker daemon, which is available natively on
# GitHub-hosted runners - no need for the "Docker-in-Docker" mount used
# locally, see iozycore/backend/README.md section 3.
on:
  pull_request:
    paths:
      - "iozycore/backend/**"
      - ".github/workflows/backend-tests.yml"
  # Manual trigger with an optional filter (useful to isolate a flaky test
  # without installing Java/Maven locally, e.g. -Dtest=Xxx#method).
  workflow_dispatch:
    inputs:
      maven_args:
        description: "mvn arguments (default: test)"
        required: false
        default: "test"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iozycore/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn test (unit + Testcontainers integration)
        run: mvn -B ${{ github.event.inputs.maven_args || 'test' }}
