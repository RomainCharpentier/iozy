<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne - IozyPlay</title>
  <style>
    /* Page servie par le service worker sans aucune autre ressource : les
       couleurs de la charte (docs/CHARTE.md) sont donc recopiées ici, en
       suivant la préférence du système puisque l'app n'est pas chargée. */
    :root {
      --bg: #faf6f2;
      --text: #231e1a;
      --text-dim: #544a43;
      --accent: #bc583b;
      --accent-press: #933d24;
      --accent-ink: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16120f;
        --text: #f4eee7;
        --text-dim: #c2b5a9;
        --accent: #d9694a;
        --accent-press: #f0a184;
        --accent-ink: #16120f;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .offline-container {
      text-align: center;
      max-width: 500px;
    }

    .offline-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 32px;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      color: var(--text);
    }

    p {
      font-size: 18px;
      color: var(--text-dim);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .retry-button {
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      min-height: 44px;
      padding: 12px 24px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .retry-button:hover {
      background: var(--accent-press);
    }

    .retry-button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Il semble que vous n'ayez pas de connexion Internet.
      Vérifiez votre connexion et réessayez.
    </p>
    <button class="retry-button" onclick="window.location.reload()">
      Réessayer
    </button>
  </div>
</body>
</html>
