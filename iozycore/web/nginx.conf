# One site for the Iozy apps. The root / is its home page; IozyCore (the React
# build, an SPA with a fallback to its index.html for routes like
# /core/entity/:id) lives under /core/; IozyTest under /test/ in its own
# container; /api goes to the backend internally (Docker Compose service
# name "iozycore-api", resolved by the internal DNS of the compose network,
# never exposed directly to the browser). The browser sees ONE origin, so
# one address, one certificate, one session cookie.

# WebSocket: `Connection` must say "upgrade" when the client asks for one,
# and "close" otherwise (the Socket.IO of IozyTest goes through here).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme the BROWSER used. On the NAS, the DSM reverse proxy ends TLS and
# talks plain HTTP to this server, so $scheme is always "http". Sent as is,
# Spring would think the request is not secure and set the XSRF-TOKEN cookie
# without `Secure`. Keep the value of the proxy in front when it sends one;
# without a proxy in front (local stack), fall back to our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects as paths, never as full URLs: behind the DSM reverse proxy
    # (HTTPS in front, HTTP here) a full URL would say http:// and the wrong
    # port. The browser keeps the origin it came from.
    absolute_redirect off;

    # No nginx version in the Server header and on the error pages.
    server_tokens off;

    # Security headers, for every answer (`always`: errors too).
    # - nosniff: a file is read only as the type the server gives it.
    # - frame-ancestors 'self': no other site can show the app in a frame and
    #   trick a logged-in user into clicking (the session is a cookie).
    # - Referrer-Policy: other sites see the origin, never the full path.
    #
    # TRAP: nginx drops these lines in any location that has its own
    # add_header. So the locations below set their cache rules with
    # `expires`, never with add_header Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The internal Docker DNS, and a SHORT validity time.
    #
    # Without these two lines, nginx resolves "iozycore-api" ONCE, at startup,
    # and keeps the address forever. Recreating the API container gives it a
    # new IP: the API answers fine on :8080 while the site returns 502, and
    # nothing in the logs says why. The known workaround was "restart web
    # after every --force-recreate" - a rule that must be remembered, and that
    # nobody remembers when the update is automatic.
    #
    # 127.0.0.11 is the embedded Docker resolver, present in every
    # user-defined compose network. `ipv6=off` avoids an AAAA request that
    # never succeeds here and delays every resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # The upstream goes through a VARIABLE, and that changes everything:
        # nginx resolves a name at startup only if it is written in plain
        # text. As a variable, the resolution happens on every request, with
        # the 10 s cache of the resolver above.
        #
        # `$request_uri` is then required: as soon as a proxy_pass contains a
        # variable, nginx stops copying the request URI by itself. Without it,
        # /api/auth/me would go to / - the proxy would "work", while always
        # serving the wrong route.
        set $amont_api iozycore-api;
        proxy_pass http://$amont_api:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Spring Security already sends nosniff: hide its copy, so the
        # answer has the header once (from the server block above).
        proxy_hide_header X-Content-Type-Options;

        # The body limit of the API, the same as
        # spring.servlet.multipart.max-request-size in application.yml (13MB:
        # up to 8 photos of 3 MB for the purchase analysis, and imports). The
        # nginx default is 1 MB: one normal phone photo gets a 413, and only
        # here, since the Vite dev proxy has no limit. Change both together.
        client_max_body_size 13m;
    }

    # The manifest type, which nginx does not know. Its mime.types table
    # has NO entry for `.webmanifest`: served as is, it goes out as
    # `application/octet-stream`, and this is the kind of gap that only shows
    # in production - the Vite dev server sets the right type.
    location = /core/manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # The service worker must never be served from an HTTP cache: IT decides
    # what the browser keeps, and a frozen version would keep applying the
    # rules of a previous deployment.
    location = /core/sw.js {
        # `expires epoch` sends Cache-Control: no-cache (see the TRAP above).
        expires epoch;
    }

    # The home page of the site, built with the app (web/home/), served at the
    # root of the site.
    location = / {
        # Never kept by a browser cache: with no header, browsers keep an HTML
        # page by heuristic and a release stays invisible for hours (seen).
        expires epoch;
        try_files /core/home/index.html =404;
    }
    location = /core/home/ {
        return 301 /;
    }

    # The shell of the app, same rule: revalidated at every visit. The hashed
    # files under /core/assets/ keep the default, their name changes with
    # their content.
    location = /core/index.html {
        expires epoch;
    }

    # IozyCore: its files, then its index.html for every route of the app.
    location = /core {
        return 301 /core/;
    }
    location /core/ {
        try_files $uri $uri/ /core/index.html;
    }

    # IozyTest under /test. The container is OPTIONAL: the upstream is a
    # variable like /api above, so nginx starts without it and only /test
    # answers 502. The app, its API and its socket all live under this prefix
    # (IOZYTEST_BASE_PATH in that image, /test by default). WebSocket needs the
    # two Upgrade headers and a long read timeout, or a game drops after 60 s.
    location = /test {
        return 301 /test/;
    }
    location /test/ {
        set $amont_test iozytest;
        proxy_pass http://$amont_test:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # The address of IozyTest before its rename: invitation links, bookmarks,
    # the installed app. Same path, same query. A 302 and not a 301: browsers
    # keep a 301 for good, and the route could still change.
    location = /play {
        return 302 /test/;
    }
    location /play/ {
        rewrite ^/play/(.*)$ /test/$1 redirect;
    }

    # Everything else at the root is an address of the app from before it
    # moved under /core/: a bookmark, a share link, the installed PWA. Send
    # them where the app now lives, with the same path.
    location / {
        return 301 /core$request_uri;
    }
}
