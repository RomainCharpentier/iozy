<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dark from the first paint. The charter's CSS (iozykit package) sets the
         light theme on :root and the dark one on this attribute, and the app
         starts dark (src/common/lib/theme.ts): without it here, the light
         theme would show until the first script runs. That script removes
         the attribute when the stored choice is light. -->
    <!-- Brand generated by scripts/make-icons.mjs (`npm run icons`).
         The SVG first: a single file, sharp at every size, and it follows the
         system light/dark preference. The PNG follows as a fallback for
         browsers that ignore SVG favicons, and is used as the home screen
         icon on iOS. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/apple-touch-icon.png" type="image/png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable on the home screen: the manifest and its icons come from
         the same script as the brand above (`npm run icons`), so a promised
         icon is never missing - a missing icon does not make the app less
         pretty, it makes it NOT installable, with no message anywhere. The
         service worker is registered from main.tsx. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The system bar color, set BEFORE the first byte of CSS.
         Two declarations, because the app has two themes and the browser
         picks the first one that matches. -->
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf6f2" media="(prefers-color-scheme: light)" />
    <title>IozyCore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
