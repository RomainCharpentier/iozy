# A DISPOSABLE stack, for the end-to-end tests.
#
# ## Why a separate stack, and not the development instance
# The E2E tests write: they create works, ownerships, wishes.
# Running them on the everyday instance would pollute a real collection -
# and the split by owner would not be enough, because the CATALOGUE is shared
# by design (a work is the same for everyone). The series invented by the
# tests would then show up in "Rechercher ▸ Déjà dans IozyCore".
#
# Hence: its own database, its own port, and an anonymous volume that goes
# away with `down -v`. Nothing to clean up, nothing to remember.
#
# ## Usage
#   docker compose -p iozycore-e2e -f docker-compose.e2e.yml up -d --wait
#   docker compose -p iozycore-e2e -f docker-compose.e2e.yml down -v
#
# `npm run test:e2e` (in web/) does both around the tests.

services:
  iozycore-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iozycore_e2e
      DB_USER: iozycore
      DB_PASSWORD: iozycore_e2e
      # The tests create the FIRST account, which is free: no invite code
      # is needed. The FOLLOWING accounts require one, and the suite
      # knows it (web/e2e/compte.ts): the import flow creates a
      # second account to delete it afterwards - the administrator of the suite
      # cannot delete themselves. A wrong code is still refused, and a
      # flow checks it (porte.spec.ts).
      IOZYCORE_INVITE_CODE: code-e2e
      # No TLS in front locally: a `Secure` cookie would never be set.
      SESSION_COOKIE_SECURE: "false"
      # The origin of the dev server started by Playwright (see
      # playwright.config.ts) - without it, every write would get a 403.
      WEB_ALLOWED_ORIGINS: http://localhost:5174
      # No external service key, HARD-CODED: the tests must not depend on
      # any provider or use up any quota, and the screens that depend on one
      # are cleanly absent. No `${GEMINI_API_KEY:-}` here: Compose
      # also substitutes from backend/.env, and the real key
      # ended up in this stack (2026-09-04) - the listing analysis called
      # the AI during the tests and went over their ten seconds. To check a
      # provider live, the development stack is the one to use.
      GOOGLE_BOOKS_API_KEY: ""
      GEMINI_API_KEY: ""
      GEMINI_MODEL: ""
      GEMINI_FALLBACK_MODEL: ""
      # Nothing to re-read at night on a disposable stack without a provider: the
      # release calendar only shows the dates entered by hand.
      RELEASES_REFRESH_ENABLED: "false"
    ports:
      # 8090 and not 8080: the development stack can run at the same time.
      - "8090:8080"
    # Probed on the only route open without an account: `--wait` therefore waits
    # for an API that ANSWERS, not a container that started. The Flyway migrations
    # run before Tomcat accepts a request.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/auth/etat || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iozycore_e2e
      POSTGRES_USER: iozycore
      POSTGRES_PASSWORD: iozycore_e2e
    # No named volume: the database lives and dies with the stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iozycore -d iozycore_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
