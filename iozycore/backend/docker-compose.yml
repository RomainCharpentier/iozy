version: "3.9"

# LOCAL DEVELOPMENT compose: starts the API, PostgreSQL and the prod
# build of the web app, exposed directly on localhost, with no reverse proxy
# and no HTTPS. To develop the web app with hot reload, prefer
# `npm run dev` in web/ (see web/README.md) over this "web" service,
# which serves a static build. For the real deployment on the Synology NAS,
# use docker-compose.synology.yml (with Traefik + Let's Encrypt).
#
# Start: docker compose up --build
# API available at     http://localhost:8080
# Swagger UI at        http://localhost:8080/swagger-ui.html
# Web app at           http://localhost:8081

services:
  iozycore-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iozycore
      DB_USER: iozycore
      # The default is for the development machine, and for it alone.
      # On a NAS behind a reverse proxy, set it in .env - it is the
      # only secret that protects the database if a port ends up exposed.
      DB_PASSWORD: ${DB_PASSWORD:-iozycore_dev}
      # Invite code required to create an account AFTER the first one (the
      # first one is free, and takes over the collection already in the database).
      # If left empty, creation is CLOSED once the first account exists:
      # missing configuration closes the door, it does not open it.
      IOZYCORE_INVITE_CODE: ${IOZYCORE_INVITE_CODE:-}
      # `true` as soon as there is TLS in front: a `Secure` session cookie is
      # not sent in clear text. False locally, where everything uses http://localhost.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # The origins allowed to WRITE. The default covers dev (:5173) and the
      # local Docker build (:8081); behind a reverse proxy - the DSM one,
      # for example - the real domain must be put here, otherwise every write
      # gets a 403. Reading would still work: the problem shows at the
      # first add, not at the first load.
      WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      # Optional - see .env.example. Without a token, BGG calls still
      # work for local testing but do not follow the current BGG
      # terms (see README, section "Statistiques").
      BGG_APPLICATION_TOKEN: ${BGG_APPLICATION_TOKEN:-}
      # Optional - see .env.example. Without credentials, video game search and
      # discovery return an empty list (IGDB has no degraded
      # mode, unlike BGG).
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      # Optional - see .env.example. Completes Jikan for manga search
      # (a relay when MyAnimeList blocks Jikan); without a Client ID,
      # Jikan stays alone as before, behaviour unchanged.
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      # Optional - see .env.example. Without a key, Google Books calls
      # work but use the shared anonymous quota (frequent 429).
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      RELEASES_REFRESH_ENABLED: ${RELEASES_REFRESH_ENABLED:-true}
      RELEASES_REFRESH_SERIES_PER_NIGHT: ${RELEASES_REFRESH_SERIES_PER_NIGHT:-10}
      # Optional, separated by commas - see .env.example. Backup key(s)
      # (2nd Google Cloud project, independent quota) tried as soon as
      # the main key answers 429.
      GOOGLE_BOOKS_BACKUP_API_KEYS: ${GOOGLE_BOOKS_BACKUP_API_KEYS:-}
      # Optional - see .env.example. Without a key, the AI help of the
      # purchase analysis stays absent (adapter disables itself).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Optional - the relay model when the main one is saturated (default in
      # the code: gemini-3.5-flash-lite); the same name as the main one disables it.
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
    ports:
      - "8080:8080"
    volumes:
      - media_data:/app/media

  web:
    # Context = the repository root: the image needs iozykit/ there.
    build:
      context: ../..
      dockerfile: iozycore/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - iozycore-api
    ports:
      - "8081:80"

  # IozyPlay (the blindtest), served by the same nginx under /play: one
  # address for every Iozy app. Built from iozyplay/ of this repository.
  iozyplay:
    build:
      context: ../..
      dockerfile: iozyplay/Dockerfile
    restart: unless-stopped
    volumes:
      - iozyplay_data:/app/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iozycore
      POSTGRES_USER: iozycore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iozycore_dev}
    ports:
      - "5432:5432"   # exposed locally only, handy for a SQL client
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iozycore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media_data:
  iozyplay_data:
