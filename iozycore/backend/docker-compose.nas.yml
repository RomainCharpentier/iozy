version: "3.9"

# Deployment on a Synology NAS, BEHIND the DSM reverse proxy.
#
# ─── Why this file, and not docker-compose.yml ───────────────────────────
# Two differences, one idea: the NAS builds nothing.
#
#   1. `image:` instead of `build:`. Building here would need Maven and Node
#      on a Celeron J3455 - possible, slow, and to redo at every update.
#      The images are built on GitHub Actions at every push on
#      `main`, and the NAS PULLS them (see the `watchtower` service below).
#   2. Only one published port, 8081. The API (8080) and PostgreSQL (5432) stay
#      in the internal network: nginx reaches the API by the service name, and
#      nothing else has a reason to be reachable from the LAN.
#
# ─── Why not docker-compose.synology.yml ─────────────────────────────────
# That one ships Traefik and asks for ports 80 and 443, which DSM uses.
# Here, the DSM reverse proxy does the job - it already handles the
# Let's Encrypt certificates, and it only needs one entry:
#
#   HTTPS · your-name.synology.me · 443   →   HTTP · localhost · 8081
#
# Only one, because nginx (the `web` container) already routes /api to the API
# internally: the browser sees only ONE origin, which the session cookie
# depends on (see docs/DEPLOIEMENT.md, "Pourquoi la réécriture").
#
# ─── The update is AUTOMATIC ─────────────────────────────────────────────
# What is on `main` arrives here by itself: GitHub Actions tests, builds
# the two images and publishes them on GHCR; `watchtower`, below, pulls
# them and restarts what changed (see .github/workflows/deploiement.yml).
#
# The NAS FETCHES, it is never called: no incoming port, no GitHub agent,
# nothing to open on the box. This is what rules out the
# self-hosted runner and SSH from GitHub, which needed one or the other.
#
# Accepted trade-off: the delay is the polling one (5 min below), and
# a faulty push goes to production like the others - that is the point of
# the request. The gates are UPSTREAM, in the workflow: nothing is published if
# the tests refuse.
#
# ─── Getting started ─────────────────────────────────────────────────────
#   1. Log in once to GHCR (private repository):
#        docker login ghcr.io -u <your-github-login>
#      (password = a GitHub personal token with the `read:packages` scope)
#   2. Create .env next to this file (see .env.example):
#        DB_PASSWORD=...
#        WEB_ALLOWED_ORIGINS=https://your-name.synology.me
#        GHCR_USER=... / GHCR_TOKEN=...   (the same token, for watchtower)
#   3. docker compose -f docker-compose.nas.yml up -d
#      (on an older DSM, the command is written `docker-compose -f ...`:
#       Container Manager only has the two-word form since Compose v2)
#
# ─── Two traps, met for real ─────────────────────────────────────────────
#   - `DB_PASSWORD` only changes what the API presents. The real password
#     is set at the FIRST creation of the volume and never moves after:
#     changing it later gives "password authentication failed". Align the
#     existing one rather than recreating the volume (the collection would be lost):
#       docker exec -e PGPASSWORD=<old> <postgres-container> \
#         psql -U iozycore -d iozycore -c "ALTER USER iozycore WITH PASSWORD '<new>';"
#   - "After recreating the API, restart web": this trap is FIXED, and it
#     had to be. nginx resolved `iozycore-api` at startup and
#     kept the old address - the API answered 200 on :8080 while
#     :8081 gave 502. The workaround was an instruction to remember, and
#     an automatic update has nobody to remember it. nginx
#     now re-resolves on every request (see web/nginx.conf, `resolver`).

services:
  iozycore-api:
    # `latest` and not a SHA: this is what watchtower follows. Going back
    # is done by pinning a published SHA here (see the workflow, which
    # tags each image both ways) then running `up -d` again.
    image: ghcr.io/romaincharpentier/iozycore-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iozycore}
      DB_USER: ${DB_USER:-iozycore}
      DB_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
      # The domain served by the DSM reverse proxy. Without it, reading
      # works and EVERY write gets a 403: the problem shows at the first
      # add, not at the first load.
      WEB_ALLOWED_ORIGINS: "${WEB_ALLOWED_ORIGINS:?erreur - définir WEB_ALLOWED_ORIGINS dans .env (ex: https://ton-nom.synology.me)}"
      # There is TLS in front: the session cookie never leaves in clear text.
      SESSION_COOKIE_SECURE: "true"
      # Empty = account creation CLOSED after the first one. This is the
      # wanted default for an exposed instance: missing configuration closes the
      # door, it does not open it.
      IOZYCORE_INVITE_CODE: ${IOZYCORE_INVITE_CODE:-}
      # All optional: without them, the matching features
      # are cleanly absent (see .env.example, which says what each one turns off).
      BGG_APPLICATION_TOKEN: ${BGG_APPLICATION_TOKEN:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      RELEASES_REFRESH_ENABLED: ${RELEASES_REFRESH_ENABLED:-true}
      RELEASES_REFRESH_SERIES_PER_NIGHT: ${RELEASES_REFRESH_SERIES_PER_NIGHT:-10}
      GOOGLE_BOOKS_BACKUP_API_KEYS: ${GOOGLE_BOOKS_BACKUP_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - media_data:/app/media
    networks:
      - internal
    labels:
      # What watchtower is allowed to update. It runs with
      # `--label-enable`: without this label, a container is ignored. The
      # default is therefore "do not touch it", which protects `postgres`.
      com.centurylinklabs.watchtower.enable: "true"

  web:
    image: ghcr.io/romaincharpentier/iozycore-web:latest
    restart: unless-stopped
    depends_on:
      - iozycore-api
    # The ONLY published port. This is the one the DSM reverse proxy targets.
    ports:
      - "8081:80"
    networks:
      - internal
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # IozyPlay (the blindtest), under /play behind the same nginx: one address,
  # one certificate, one reverse proxy entry. Its image is built from
  # iozyplay/ of this repository by the deploy workflow, like the two others;
  # watchtower follows it the same way. The questions added from the app live
  # in the volume.
  iozyplay:
    image: ghcr.io/romaincharpentier/iozyplay-app:latest
    restart: unless-stopped
    volumes:
      - iozyplay_data:/app/data
    networks:
      - internal
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # The only container that talks to the outside, and it only ASKS.
  #
  # Every 5 minutes: "have these images changed?". If yes, it pulls
  # them, recreates the containers concerned, and stops there. `--cleanup`
  # removes the replaced image - without it, the NAS disk fills up with one
  # version per deployment, silently.
  #
  # It only watches what carries the label below: `postgres` must
  # never be updated by itself. A major version jump of
  # PostgreSQL refuses to start on an existing data directory, and
  # it would happen on a Sunday at 3 am, with nobody to read it.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --label-enable --cleanup --interval 300
    environment:
      # The repository is private: without these two values, watchtower queries GHCR
      # anonymously, gets a refusal, and goes quiet. A READ-only token
      # (`read:packages`) is enough - it publishes nothing.
      REPO_USER: ${GHCR_USER:?erreur - définir GHCR_USER dans .env}
      REPO_PASS: ${GHCR_TOKEN:?erreur - définir GHCR_TOKEN dans .env}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # The only way to recreate a neighbour container. It is full access to the
      # Docker daemon of the NAS: it is worth what the `containrrr/watchtower`
      # image is worth, and this is why nothing else is mounted here.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iozycore}
      POSTGRES_USER: ${DB_USER:-iozycore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iozycore}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  internal:

volumes:
  postgres_data:
  media_data:
  iozyplay_data:
