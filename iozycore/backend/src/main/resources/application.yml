# The release that is running - the commit SHA, written into the image at build time (see
# Dockerfile). `dev` outside a container: run from an IDE, there is no
# release to name.
iozycore:
  version: ${IOZYCORE_VERSION:dev}
  releases:
    # The release calendar (batch 146) re-reads the ONGOING manga series every night
    # so that announced volumes end up in it - the
    # result of a volume search is otherwise never recalled. A few
    # series per night, the oldest first, never more: the daily
    # Google Books quota stays for those who use it during the day. A
    # provider outage stops the night without erasing anything.
    refresh:
      enabled: ${RELEASES_REFRESH_ENABLED:true}
      # At 4:30, server time: nobody looks for volumes at that hour.
      cron: "0 30 4 * * *"
      series-per-run: ${RELEASES_REFRESH_SERIES_PER_NIGHT:10}
      # A series re-read less than a week ago is not re-read again.
      stale-after-days: 7
  covers:
    # The missing covers of the manga volumes (batch 194): a volume added by
    # number, by photo or during a provider outage has none, and nobody
    # presses "Retrouver les jaquettes manquantes". The catalogue fills them
    # itself from the volume searches (BnF first, served from cache when
    # fresh): a little after each start, then every hour as long as volumes
    # miss a cover (a run that finds nothing to do costs one database read).
    # A run stops at the first series that gets nothing while a provider is
    # silent - the BnF drops connections after a burst - and the next hour
    # picks up where it stopped. Off on the e2e stack, like the release
    # refresh, so that no test reaches a provider.
    backfill:
      enabled: ${COVERS_BACKFILL_ENABLED:${RELEASES_REFRESH_ENABLED:true}}
      initial-delay-ms: ${COVERS_BACKFILL_INITIAL_DELAY_MS:120000}
      every-ms: 3600000
      series-per-run: ${COVERS_BACKFILL_SERIES_PER_RUN:25}
      # Between two series that may reach the BnF, which limits the rate per address.
      pause-ms: 1500

spring:
  application:
    name: iozycore
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iozycore}
    username: ${DB_USER:iozycore}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate   # the schema is driven by Flyway, never by Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Aligned with RecognitionImageLimits (3 MB per photo, 12 MB in total).
      # Without these two lines, Spring refuses at 1 MB per file: the limit of
      # the code would never be reached, and the user would get a framework
      # error instead of the message that tells them what to do.
      max-file-size: 3MB
      # A little above the total: multipart also carries the text fields
      # and its own delimiters.
      max-request-size: 13MB

server:
  # `PORT` is the convention of managed hosts (Railway, Render, Fly):
  # they impose it and route traffic to THIS port. Without the variable,
  # the health check would fail on a port that does not answer. 8080
  # stays the local default, the one of docker-compose.
  port: ${PORT:8080}
  # Behind a TLS proxy (Vercel in front, or the host's router), the
  # request reaches the application in clear text: without reading the
  # `X-Forwarded-*` headers, it thinks it is on HTTP and refuses to set a
  # `Secure` session cookie. Nobody would stay logged in, with no error anywhere.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        # `Lax` and not `None`: the API is served under the SAME origin as the app
        # (Vite proxy in dev, nginx in production). The cookie therefore never has
        # to travel cross-site, and `Lax` also blocks the writes
        # triggered by a third-party page.
        same-site: lax
        # Set to `true` as soon as there is TLS in front (deployment): a
        # `Secure` cookie is not sent in clear text. False by default, otherwise
        # development on http://localhost would keep no session.
        secure: ${SESSION_COOKIE_SECURE:false}
      # A session sleeps for eight hours: enough to get through a day without
      # logging in again, without leaving a phone lying on a table open
      # forever.
      timeout: 8h
  error:
    # The explicit refusals thrown by the controllers (ResponseStatusException)
    # carry a message written FOR the user - "Impossible de supprimer
    # cette édition : 3 tome(s) y sont encore rattachés". Without this setting,
    # Spring does not pass it on: the client only received the HTTP status
    # phrase ("Conflict", "Not Found") and so showed generic English
    # in place of the reason (seen during verification, Batch 26).
    # Self-hosted personal application: no unwanted exposure,
    # these messages are written precisely to be read.
    include-message: always

auth:
  # Invite code required to create an account AFTER the first one (the first one
  # is free: someone has to get in, and it takes over the collection
  # already in the database). Left empty, creation is CLOSED once the first
  # account exists - missing configuration closes the door, it does not open
  # it. See AuthService.
  invite-code: ${IOZYCORE_INVITE_CODE:}

web:
  # Origins allowed for POST/PATCH/DELETE requests of the web client
  # (see api/config/CorsConfig.java for the why - even with
  # nginx-proxied "same-origin" use, these methods send an Origin header
  # that Spring checks). CSV, default values = Vite dev (:5173) +
  # local Docker build (:8081). On Synology, set it with the real domain
  # of the web service.
  allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

bgg:
  # Required by BGG since July 2025 for almost all of its XML API
  # (see boardgamegeek.com/using_the_xml_api) - register an application
  # on boardgamegeek.com/applications, then put the token here.
  # Left empty, BGG calls still work for local
  # development but do not follow the current BGG terms.
  application-token: ${BGG_APPLICATION_TOKEN:}

igdb:
  # Twitch Developer Console credentials (OAuth2 client-credentials flow) -
  # see README.md, section "Obtenir et configurer des identifiants
  # IGDB/Twitch". Unlike BGG, IGDB does not work at all without
  # these credentials (no degraded/anonymous mode): video game search and
  # discovery return an empty list while they are missing.
  client-id: ${IGDB_CLIENT_ID:}
  client-secret: ${IGDB_CLIENT_SECRET:}

mal:
  # MyAnimeList Client ID (official API v2, no full OAuth flow
  # required for public search) - see README.md, section "Obtenir
  # et configurer un Client ID MyAnimeList". Completes Jikan for the
  # MANGA type (never in its place): without a configured Client ID, this provider
  # is simply absent and Jikan keeps working alone as
  # before. Useful when Jikan is unavailable (MyAnimeList blocks/throttles
  # this third-party wrapper from time to time, unlike the official API).
  client-id: ${MAL_CLIENT_ID:}

google-books:
  # Google Books API key (console.cloud.google.com, "Books API" enabled) -
  # optional: without a key, calls still work but share the
  # worldwide anonymous quota (frequent 429 "Quota exceeded" in practice). A
  # key gives a quota dedicated to this project. Used by the 4 Google Books
  # providers through GoogleBooksHttpClient (ISBN scan, French title by
  # resolution/direct, volume search).
  api-key: ${GOOGLE_BOOKS_API_KEY:}
  # Backup key(s), separated by commas (e.g. "key2,key3") - a 2nd
  # Google Cloud project with its own "Books API" key has its own independent
  # daily quota: GoogleBooksHttpClient switches to it as soon as the
  # main key answers 429, before giving up. Checked by hand
  # (see history): an intensive test session uses up the default quota of
  # a single key in a few dozen volume searches (8
  # requests each).
  backup-api-keys: ${GOOGLE_BOOKS_BACKUP_API_KEYS:}

gemini:
  # Google Gemini API key (aistudio.google.com/apikey) - real free
  # tier (not a trial that expires), no bank card required, see
  # README.md. Optional: without a key, the AI help of the purchase analysis
  # (auto-filled edition sheets, price estimate) is simply
  # absent, same self-disabling adapter as BGG/IGDB.
  api-key: ${GEMINI_API_KEY:}
  # The default below only applies if GEMINI_MODEL is missing from
  # the environment - docker-compose.yml always sets this variable (even
  # empty), so the real default ("gemini-3.5-flash") lives in the code (see
  # GeminiEditionAdvisor/GeminiMarketPriceAdvisor), not here.
  model: ${GEMINI_MODEL:}
  # The model that takes over when the main one is saturated or does not answer in
  # time. Same rule: the real default ("gemini-3.5-flash-lite") lives in the code
  # (GeminiRequests). Setting the same name as the main one turns off the fallback.
  fallback-model: ${GEMINI_FALLBACK_MODEL:}
