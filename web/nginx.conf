# Sert le build React (SPA - fallback vers index.html pour les routes
# client-side comme /entity/:id) et proxy /api vers le backend en interne
# (nom de service Docker Compose "iozycore-api", résolu par le DNS interne
# du réseau compose - jamais exposé directement au navigateur).

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Le DNS interne de Docker, et une durée de validité COURTE.
    #
    # Sans ces deux lignes, nginx résout « iozycore-api » UNE FOIS, à son
    # démarrage, et garde l'adresse pour toujours. Recréer le conteneur de
    # l'API lui donne une nouvelle IP : l'API répond parfaitement sur :8080
    # pendant que le site rend 502, et rien dans les journaux ne dit pourquoi.
    # Le contournement connu était « redémarrer web après chaque
    # --force-recreate » - une consigne qu'il faut se rappeler, et qui n'a
    # personne pour se la rappeler quand la mise à jour est automatique.
    #
    # 127.0.0.11 est le résolveur embarqué de Docker, présent dans tout réseau
    # compose défini par l'utilisateur. `ipv6=off` évite une requête AAAA qui
    # n'aboutit jamais ici et retarde chaque résolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # L'amont passe par une VARIABLE, et c'est ce qui change tout : nginx
        # ne résout un nom au démarrage que s'il est écrit en dur. Sous forme
        # de variable, la résolution a lieu à chaque requête, avec le cache de
        # 10 s du résolveur ci-dessus.
        #
        # `$request_uri` est alors obligatoire : dès qu'un proxy_pass contient
        # une variable, nginx cesse de recopier l'URI de la requête tout seul.
        # Sans lui, /api/auth/me partirait vers / - le proxy « marcherait »,
        # en servant systématiquement la mauvaise route.
        set $amont_api iozycore-api;
        proxy_pass http://$amont_api:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le type du manifeste, que nginx ne connaît pas. Sa table mime.types
    # n'a AUCUNE entrée pour `.webmanifest` : servi tel quel, il part en
    # `application/octet-stream`, et c'est le genre d'écart qui ne se voit
    # qu'en production - le serveur de dev Vite, lui, pose le bon type.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Le service worker ne doit jamais être servi depuis un cache HTTP :
    # c'est LUI qui décide de ce que le navigateur garde, et une version
    # figée continuerait d'appliquer les règles d'un déploiement précédent.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
