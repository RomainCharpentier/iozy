# One site for the family. The root / is its home page; IozyCore (the React
# build, an SPA with a fallback to its index.html for routes like
# /core/entity/:id) lives under /core/; IozyPlay under /play/ in its own
# container; /api goes to the backend internally (Docker Compose service
# name "iozycore-api", resolved by the internal DNS of the compose network,
# never exposed directly to the browser). The browser sees ONE origin, so
# one address, one certificate, one session cookie.

# WebSocket: `Connection` must say "upgrade" when the client asks for one,
# and "close" otherwise (the Socket.IO of IozyPlay goes through here).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects as paths, never as full URLs: behind the DSM reverse proxy
    # (HTTPS in front, HTTP here) a full URL would say http:// and the wrong
    # port. The browser keeps the origin it came from.
    absolute_redirect off;

    # The internal Docker DNS, and a SHORT validity time.
    #
    # Without these two lines, nginx resolves "iozycore-api" ONCE, at startup,
    # and keeps the address forever. Recreating the API container gives it a
    # new IP: the API answers fine on :8080 while the site returns 502, and
    # nothing in the logs says why. The known workaround was "restart web
    # after every --force-recreate" - a rule that must be remembered, and that
    # nobody remembers when the update is automatic.
    #
    # 127.0.0.11 is the embedded Docker resolver, present in every
    # user-defined compose network. `ipv6=off` avoids an AAAA request that
    # never succeeds here and delays every resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # The upstream goes through a VARIABLE, and that changes everything:
        # nginx resolves a name at startup only if it is written in plain
        # text. As a variable, the resolution happens on every request, with
        # the 10 s cache of the resolver above.
        #
        # `$request_uri` is then required: as soon as a proxy_pass contains a
        # variable, nginx stops copying the request URI by itself. Without it,
        # /api/auth/me would go to / - the proxy would "work", while always
        # serving the wrong route.
        set $amont_api iozycore-api;
        proxy_pass http://$amont_api:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The manifest type, which nginx does not know. Its mime.types table
    # has NO entry for `.webmanifest`: served as is, it goes out as
    # `application/octet-stream`, and this is the kind of gap that only shows
    # in production - the Vite dev server sets the right type.
    location = /core/manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # The service worker must never be served from an HTTP cache: IT decides
    # what the browser keeps, and a frozen version would keep applying the
    # rules of a previous deployment.
    location = /core/sw.js {
        add_header Cache-Control "no-cache";
    }

    # The home of the family, built with the app (web/famille/), served at the
    # root of the site.
    location = / {
        try_files /core/famille/index.html =404;
    }
    location = /core/famille/ {
        return 301 /;
    }

    # IozyCore: its files, then its index.html for every route of the app.
    location = /core {
        return 301 /core/;
    }
    location /core/ {
        try_files $uri $uri/ /core/index.html;
    }

    # IozyPlay under /play. The container is OPTIONAL: the upstream is a
    # variable like /api above, so nginx starts without it and only /play
    # answers 502. The app, its API and its socket all live under this prefix
    # (IOZYPLAY_BASE_PATH in that image, /play by default). WebSocket needs the
    # two Upgrade headers and a long read timeout, or a game drops after 60 s.
    location = /play {
        return 301 /play/;
    }
    location /play/ {
        set $amont_play iozyplay;
        proxy_pass http://$amont_play:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Everything else at the root is an address of the app from before it
    # moved under /core/: a bookmark, a share link, the installed PWA. Send
    # them where the app now lives, with the same path.
    location / {
        return 301 /core$request_uri;
    }
}
