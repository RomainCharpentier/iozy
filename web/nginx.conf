# Sert le build React (SPA - fallback vers index.html pour les routes
# client-side comme /entity/:id) et proxy /api vers le backend en interne
# (nom de service Docker Compose "iozycore-api", résolu par le DNS interne
# du réseau compose - jamais exposé directement au navigateur).

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://iozycore-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le type du manifeste, que nginx ne connaît pas. Sa table mime.types
    # n'a AUCUNE entrée pour `.webmanifest` : servi tel quel, il part en
    # `application/octet-stream`, et c'est le genre d'écart qui ne se voit
    # qu'en production - le serveur de dev Vite, lui, pose le bon type.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Le service worker ne doit jamais être servi depuis un cache HTTP :
    # c'est LUI qui décide de ce que le navigateur garde, et une version
    # figée continuerait d'appliquer les règles d'un déploiement précédent.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
