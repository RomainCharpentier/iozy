version: "3.9"

# Déploiement sur NAS Synology, DERRIÈRE le reverse proxy de DSM.
#
# ─── Pourquoi ce fichier, et pas docker-compose.yml ──────────────────────
# Deux différences, une seule idée : le NAS ne compile rien.
#
#   1. `image:` au lieu de `build:`. Construire ici demanderait Maven et Node
#      sur un Celeron J3455 - faisable, long, et à recommencer à chaque mise
#      à jour. Les images se construisent sur GitHub Actions à chaque push sur
#      `main`, et le NAS les RÉCUPÈRE (voir le service `watchtower` plus bas).
#   2. Un seul port publié, 8081. L'API (8080) et PostgreSQL (5432) restent
#      dans le réseau interne : nginx atteint l'API par le nom du service, et
#      rien d'autre n'a de raison d'être joignable depuis le LAN.
#
# ─── Pourquoi pas docker-compose.synology.yml ────────────────────────────
# Celui-là embarque Traefik et réclame les ports 80 et 443, que DSM occupe.
# Ici, c'est le reverse proxy de DSM qui fait le travail - il gère déjà les
# certificats Let's Encrypt, et il ne demande qu'un enregistrement :
#
#   HTTPS · ton-nom.synology.me · 443   →   HTTP · localhost · 8081
#
# Un seul, parce que nginx (conteneur `web`) achemine déjà /api vers l'API en
# interne : le navigateur ne voit qu'UNE origine, ce dont le cookie de session
# dépend (voir docs/DEPLOIEMENT.md, « Pourquoi la réécriture »).
#
# ─── La mise à jour est AUTOMATIQUE ──────────────────────────────────────
# Ce qui est sur `main` arrive ici tout seul : GitHub Actions teste, construit
# les deux images et les publie sur GHCR ; `watchtower`, ci-dessous, les
# récupère et redémarre ce qui a changé (voir .github/workflows/deploiement.yml).
#
# Le NAS VA CHERCHER, il n'est jamais appelé : aucun port entrant, aucun agent
# GitHub, rien à ouvrir sur la box. C'est ce qui écarte le runner
# auto-hébergé et le SSH depuis GitHub, qui demandaient l'un ou l'autre.
#
# Contrepartie assumée : le délai est celui du sondage (5 min ci-dessous), et
# un push fautif part en production comme les autres - c'est le sens de la
# demande. Les portes sont EN AMONT, dans le workflow : rien n'est publié si
# les tests refusent.
#
# ─── Mise en route ───────────────────────────────────────────────────────
#   1. S'identifier une fois auprès de GHCR (dépôt privé) :
#        docker login ghcr.io -u <ton-login-github>
#      (mot de passe = un jeton personnel GitHub avec la portée `read:packages`)
#   2. Créer .env à côté de ce fichier (voir .env.example) :
#        DB_PASSWORD=...
#        WEB_ALLOWED_ORIGINS=https://ton-nom.synology.me
#        GHCR_USER=... / GHCR_TOKEN=...   (le même jeton, pour watchtower)
#   3. docker compose -f docker-compose.nas.yml up -d
#      (sur un DSM plus ancien, la commande s'écrit `docker-compose -f ...` :
#       Container Manager n'a la forme en deux mots que depuis Compose v2)
#
# ─── Deux pièges, rencontrés pour de vrai ────────────────────────────────
#   - `DB_PASSWORD` ne change QUE ce que l'API présente. Le mot de passe réel
#     est fixé à la PREMIÈRE création du volume et n'en bouge plus : le
#     modifier ensuite donne « password authentication failed ». Aligner
#     l'existant plutôt que de recréer le volume (on y perdrait la collection) :
#       docker exec -e PGPASSWORD=<ancien> <conteneur-postgres> \
#         psql -U iozycore -d iozycore -c "ALTER USER iozycore WITH PASSWORD '<nouveau>';"
#   - « Après avoir recréé l'API, redémarrer web » : ce piège est RÉGLÉ, et il
#     fallait qu'il le soit. nginx résolvait `iozycore-api` au démarrage et
#     gardait l'ancienne adresse - l'API répondait 200 sur :8080 pendant que
#     :8081 rendait 502. Le contournement était une consigne à se rappeler, et
#     une mise à jour automatique n'a personne pour se la rappeler. nginx
#     re-résout désormais à chaque requête (voir web/nginx.conf, `resolver`).

services:
  iozycore-api:
    # `latest` et non un SHA : c'est ce que watchtower suit. Revenir en
    # arrière se fait en épinglant ici un SHA publié (voir le workflow, qui
    # étiquette chaque image des deux façons) puis en relançant `up -d`.
    image: ghcr.io/romaincharpentier/iozycore-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iozycore}
      DB_USER: ${DB_USER:-iozycore}
      DB_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
      # Le domaine servi par le reverse proxy de DSM. Sans lui, la lecture
      # passe et TOUTE écriture part en 403 : le défaut se remarque au premier
      # ajout, pas au premier chargement.
      WEB_ALLOWED_ORIGINS: "${WEB_ALLOWED_ORIGINS:?erreur - définir WEB_ALLOWED_ORIGINS dans .env (ex: https://ton-nom.synology.me)}"
      # Il y a du TLS devant : le cookie de session ne repart jamais en clair.
      SESSION_COOKIE_SECURE: "true"
      # Vide = création de compte FERMÉE après le premier. C'est le défaut
      # voulu pour une instance exposée : l'absence de configuration ferme la
      # porte, elle ne l'ouvre pas.
      IOZYCORE_INVITE_CODE: ${IOZYCORE_INVITE_CODE:-}
      # Toutes facultatives : sans elles, les fonctionnalités correspondantes
      # s'absentent proprement (voir .env.example, qui dit ce que chacune coupe).
      BGG_APPLICATION_TOKEN: ${BGG_APPLICATION_TOKEN:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      RELEASES_REFRESH_ENABLED: ${RELEASES_REFRESH_ENABLED:-true}
      RELEASES_REFRESH_SERIES_PER_NIGHT: ${RELEASES_REFRESH_SERIES_PER_NIGHT:-10}
      GOOGLE_BOOKS_BACKUP_API_KEYS: ${GOOGLE_BOOKS_BACKUP_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - media_data:/app/media
    networks:
      - internal
    labels:
      # Ce que watchtower a le droit de mettre à jour. Il tourne en
      # `--label-enable` : sans cette étiquette, un conteneur est ignoré. Le
      # défaut est donc « on n'y touche pas », ce qui protège `postgres`.
      com.centurylinklabs.watchtower.enable: "true"

  web:
    image: ghcr.io/romaincharpentier/iozycore-web:latest
    restart: unless-stopped
    depends_on:
      - iozycore-api
    # Le SEUL port publié. C'est lui que le reverse proxy de DSM vise.
    ports:
      - "8081:80"
    networks:
      - internal
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Le seul conteneur qui parle à l'extérieur, et il ne fait que DEMANDER.
  #
  # Toutes les 5 minutes : « ces images ont-elles changé ? ». Si oui, il les
  # récupère, recrée les conteneurs concernés, et s'arrête là. `--cleanup`
  # supprime l'image remplacée - sans lui, le disque du NAS se remplit d'une
  # version par déploiement, en silence.
  #
  # Il ne surveille QUE ce qui porte l'étiquette ci-dessous : `postgres`, lui,
  # ne doit jamais être mis à jour tout seul. Un saut de version majeure de
  # PostgreSQL refuse de démarrer sur un répertoire de données existant, et
  # cela arriverait un dimanche à 3 h du matin, sans personne pour le lire.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    command: --label-enable --cleanup --interval 300
    environment:
      # Le dépôt est privé : sans ces deux valeurs, watchtower interroge GHCR
      # en anonyme, reçoit un refus, et se tait. Un jeton en LECTURE seule
      # (`read:packages`) suffit - il ne publie rien.
      REPO_USER: ${GHCR_USER:?erreur - définir GHCR_USER dans .env}
      REPO_PASS: ${GHCR_TOKEN:?erreur - définir GHCR_TOKEN dans .env}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # Le seul moyen de recréer un conteneur voisin. C'est un accès complet au
      # démon Docker du NAS : il vaut ce que vaut l'image `containrrr/watchtower`,
      # et c'est la raison pour laquelle rien d'autre n'est monté ici.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iozycore}
      POSTGRES_USER: ${DB_USER:-iozycore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iozycore}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  internal:

volumes:
  postgres_data:
  media_data:
