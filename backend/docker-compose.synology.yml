version: "3.9"

# Déploiement IozyCore sur NAS Synology (Container Manager / docker-compose).
# 3 services : API, base de données, reverse proxy HTTPS.
# PostgreSQL n'est jamais exposé directement à l'extérieur.
#
# ─── Authentification (simplifiée le 2026-08-30) ─────────────────────────
# Ce fichier portait une authentification HTTP Basic au niveau de Traefik,
# et c'était juste : l'application n'en avait AUCUNE en propre. Sans elle,
# qui connaissait l'hôte lisait et écrivait toute la collection
# (GET /api/export/json, DELETE /api/entities/{id}), Swagger comprise - CORS
# n'y change rien, allowedOrigins n'est vérifié que par un navigateur, jamais
# par curl.
#
# Ce n'est plus vrai depuis le Lot 94 : l'API est fermée par Spring Security,
# tout répond 401 sans session, et les données sont cloisonnées par compte
# (Lot 95). Le Basic était donc devenu une SECONDE demande de mot de passe
# devant la première - et surtout il cassait les liens de partage, dont le
# destinataire est censé n'avoir rien à saisir. Il est retiré.
#
# Ce qui reste ouvert, et c'est le serveur qui le décide (voir SecurityConfig,
# pas ce fichier) : la connexion, l'état de l'instance, et
# GET /api/public/share/{jeton} - dont le jeton fait office de mot de passe.
#
# Conséquence pratique : deux routeurs Traefik au lieu de quatre. Les
# exceptions de chemin n'ont plus lieu d'être puisqu'il n'y a plus de porte
# à contourner.

services:
  iozycore-api:
    build: .
    image: iozycore-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iozycore}
      DB_USER: ${DB_USER:-iozycore}
      DB_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
      BGG_APPLICATION_TOKEN: ${BGG_APPLICATION_TOKEN:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_BACKUP_API_KEYS: ${GOOGLE_BOOKS_BACKUP_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Il y a du TLS devant (Traefik + Let's Encrypt) : le cookie de session
      # ne doit jamais repartir en clair.
      SESSION_COOKIE_SECURE: "true"
      # Vide = la création de compte est FERMÉE après le premier. C'est le
      # défaut voulu : une instance exposée sans y penser ne devient pas une
      # base ouverte à qui passe. Le définir ouvre « Créer un compte avec une
      # invitation » sur l'écran de connexion.
      IOZYCORE_INVITE_CODE: ${IOZYCORE_INVITE_CODE:-}
      # Doit correspondre au domaine du service "web" ci-dessous - requis
      # même si nginx proxy /api en apparence "same-origin" pour le
      # navigateur : les requêtes POST/PATCH/DELETE envoient toujours un
      # header Origin, que Spring vérifie (voir api/config/CorsConfig.java).
      # Guillemets OBLIGATOIRES : le message d'erreur contient "ex: https://..."
      # et un ": " dans un scalaire nu fait lire une imbrication à YAML - sans
      # eux, tout le fichier est invalide et `docker compose` refuse de le
      # charger ("mapping values are not allowed in this context", trouvé au
      # Lot 27 en validant le fichier pour la première fois).
      WEB_ALLOWED_ORIGINS: "${WEB_ALLOWED_ORIGINS:?erreur - définir WEB_ALLOWED_ORIGINS dans .env (ex: https://app.iozycore.mondomaine.tld)}"
    volumes:
      - media_data:/app/media
    networks:
      - internal
      - proxy
    labels:
      # Labels Traefik : routage HTTPS automatique avec Let's Encrypt.
      # Remplacer iozycore.mondomaine.tld par ton propre domaine/DDNS Synology.
      - "traefik.enable=true"
      # Un seul routeur : c'est l'application qui décide ce qui est ouvert,
      # pas le proxy (voir l'en-tête).
      - "traefik.http.routers.iozycore.rule=Host(`iozycore.mondomaine.tld`)"
      - "traefik.http.routers.iozycore.entrypoints=websecure"
      - "traefik.http.routers.iozycore.tls.certresolver=letsencrypt"
      - "traefik.http.services.iozycore.loadbalancer.server.port=8080"

  web:
    build: ../web
    image: iozycore-web:latest
    restart: unless-stopped
    depends_on:
      - iozycore-api
    networks:
      - internal   # pour joindre iozycore-api via le proxy nginx interne (voir web/nginx.conf)
      - proxy      # pour être routable par Traefik
    labels:
      # Sous-domaine séparé de l'API (iozycore.mondomaine.tld reste dédié à
      # l'iOS/Swagger/accès direct) - nginx proxy /api en interne vers
      # iozycore-api. Ce domaine doit être répété dans WEB_ALLOWED_ORIGINS
      # (service iozycore-api ci-dessus) : nginx rend la lecture "same-origin"
      # pour le navigateur, mais les requêtes d'écriture (POST/PATCH/DELETE)
      # envoient quand même un header Origin que Spring vérifie.
      - "traefik.enable=true"
      # L'app se protège elle-même : écran de connexion, session en cookie,
      # et les liens de partage qui s'ouvrent sans compte. Rien à filtrer ici.
      - "traefik.http.routers.iozycore-web.rule=Host(`app.iozycore.mondomaine.tld`)"
      - "traefik.http.routers.iozycore-web.entrypoints=websecure"
      - "traefik.http.routers.iozycore-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.iozycore-web.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iozycore}
      POSTGRES_USER: ${DB_USER:-iozycore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iozycore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de port exposé publiquement : uniquement accessible depuis
    # le réseau interne "internal" par iozycore-api.

  reverse-proxy:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?erreur - définir ACME_EMAIL dans .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - proxy

networks:
  internal:
  proxy:

volumes:
  postgres_data:
  media_data:
  letsencrypt_data:
