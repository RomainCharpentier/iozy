version: "3.9"

# IozyCore deployment on a Synology NAS (Container Manager / docker-compose).
# 3 services: API, database, HTTPS reverse proxy.
# PostgreSQL is never exposed directly to the outside.
#
# ─── Authentication (simplified on 2026-08-30) ───────────────────────────
# This file used to carry HTTP Basic authentication at the Traefik level,
# and that was right: the application had NONE of its own. Without it,
# anyone who knew the host could read and write the whole collection
# (GET /api/export/json, DELETE /api/entities/{id}), Swagger included - CORS
# changes nothing here, allowedOrigins is only checked by a browser, never
# by curl.
#
# This is no longer true since Batch 94: the API is closed by Spring Security,
# everything answers 401 without a session, and the data is split by account
# (Batch 95). Basic had therefore become a SECOND password prompt
# in front of the first one - and above all it broke the share links, whose
# recipient is supposed to have nothing to type. It is removed.
#
# What stays open, and the server decides it (see SecurityConfig,
# not this file): the login, the state of the instance, and
# GET /api/public/share/{token} - whose token acts as a password.
#
# Practical consequence: two Traefik routers instead of four. The
# path exceptions have no reason to exist since there is no door
# to get around.

services:
  iozycore-api:
    build: .
    image: iozycore-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iozycore}
      DB_USER: ${DB_USER:-iozycore}
      DB_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
      BGG_APPLICATION_TOKEN: ${BGG_APPLICATION_TOKEN:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      RELEASES_REFRESH_ENABLED: ${RELEASES_REFRESH_ENABLED:-true}
      RELEASES_REFRESH_SERIES_PER_NIGHT: ${RELEASES_REFRESH_SERIES_PER_NIGHT:-10}
      GOOGLE_BOOKS_BACKUP_API_KEYS: ${GOOGLE_BOOKS_BACKUP_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # There is TLS in front (Traefik + Let's Encrypt): the session cookie
      # must never leave in clear text.
      SESSION_COOKIE_SECURE: "true"
      # Empty = account creation is CLOSED after the first one. This is the
      # wanted default: an instance exposed without thinking about it does not
      # become a database open to anyone. Setting it opens "Créer un compte avec une
      # invitation" on the login screen.
      IOZYCORE_INVITE_CODE: ${IOZYCORE_INVITE_CODE:-}
      # Must match the domain of the "web" service below - required
      # even if nginx proxies /api as "same-origin" in appearance for the
      # browser: POST/PATCH/DELETE requests always send an
      # Origin header, which Spring checks (see api/config/CorsConfig.java).
      # Quotes REQUIRED: the error message contains "ex: https://..."
      # and a ": " in a bare scalar makes YAML read a nesting - without
      # them, the whole file is invalid and `docker compose` refuses to
      # load it ("mapping values are not allowed in this context", found in
      # Batch 27 when validating the file for the first time).
      WEB_ALLOWED_ORIGINS: "${WEB_ALLOWED_ORIGINS:?erreur - définir WEB_ALLOWED_ORIGINS dans .env (ex: https://app.iozycore.mondomaine.tld)}"
    volumes:
      - media_data:/app/media
    networks:
      - internal
      - proxy
    labels:
      # Traefik labels: automatic HTTPS routing with Let's Encrypt.
      # Replace iozycore.mondomaine.tld with your own Synology domain/DDNS.
      - "traefik.enable=true"
      # Only one router: the application decides what is open,
      # not the proxy (see the header).
      - "traefik.http.routers.iozycore.rule=Host(`iozycore.mondomaine.tld`)"
      - "traefik.http.routers.iozycore.entrypoints=websecure"
      - "traefik.http.routers.iozycore.tls.certresolver=letsencrypt"
      - "traefik.http.services.iozycore.loadbalancer.server.port=8080"

  web:
    build: ../web
    image: iozycore-web:latest
    restart: unless-stopped
    depends_on:
      - iozycore-api
    networks:
      - internal   # to reach iozycore-api through the internal nginx proxy (see web/nginx.conf)
      - proxy      # to be routable by Traefik
    labels:
      # Separate subdomain from the API (iozycore.mondomaine.tld stays dedicated to
      # iOS/Swagger/direct access) - nginx proxies /api internally to
      # iozycore-api. This domain must be repeated in WEB_ALLOWED_ORIGINS
      # (iozycore-api service above): nginx makes reading "same-origin"
      # for the browser, but write requests (POST/PATCH/DELETE)
      # still send an Origin header that Spring checks.
      - "traefik.enable=true"
      # The app protects itself: login screen, cookie session,
      # and share links that open without an account. Nothing to filter here.
      - "traefik.http.routers.iozycore-web.rule=Host(`app.iozycore.mondomaine.tld`)"
      - "traefik.http.routers.iozycore-web.entrypoints=websecure"
      - "traefik.http.routers.iozycore-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.iozycore-web.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iozycore}
      POSTGRES_USER: ${DB_USER:-iozycore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iozycore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No publicly exposed port: only reachable from
    # the "internal" network by iozycore-api.

  reverse-proxy:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?erreur - définir ACME_EMAIL dans .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - proxy

networks:
  internal:
  proxy:

volumes:
  postgres_data:
  media_data:
  letsencrypt_data:
