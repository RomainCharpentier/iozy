version: "3.9"

# Déploiement IozyCore sur NAS Synology (Container Manager / docker-compose).
# 3 services : API, base de données, reverse proxy HTTPS.
# PostgreSQL n'est jamais exposé directement à l'extérieur.
#
# ─── Authentification ────────────────────────────────────────────────────
# L'application n'en a AUCUNE en propre : mono-utilisateur strict, aucun
# owner_id exploité, aucun Spring Security (choix documenté dans README.md,
# "cohérent avec le choix mono-utilisateur, à ajouter si l'app doit un jour
# être exposée au-delà du réseau local"). Or ce fichier-ci fait exactement
# cela : il publie l'API ET l'app web sur Internet via Traefik + Let's
# Encrypt. Sans le garde-fou ci-dessous, qui connaît l'hôte peut lire et
# écrire toute la collection (GET /api/export/json, DELETE /api/entities/
# {id}), Swagger UI comprise. CORS n'y change rien : allowedOrigins n'est
# vérifié que par un navigateur, jamais par curl.
#
# D'où une authentification HTTP Basic portée par le proxy, pas par
# l'application : une SPA ne peut pas garder un secret (tout jeton embarqué
# dans le bundle JS est lisible par qui charge la page), alors que Basic est
# géré nativement par le navigateur et se transmet ensuite tout seul aux
# appels /api same-origin.
#
# Les DEUX pages de partage restent délibérément hors authentification -
# c'est toute leur raison d'être (voir PublicWishlistController /
# PublicCollectionController : le jeton fait office de mot de passe) :
#   - /public/*      les deux écrans partagés (rendus hors AppShell)
#   - /assets/*      le bundle JS/CSS sans lequel ces écrans sont blancs
#   - /api/public/*  les deux seuls endpoints non authentifiés
# Tout le reste exige les identifiants.
#
# Définir BASIC_AUTH_USERS dans .env, au format htpasswd :
#   docker run --rm httpd:alpine htpasswd -nbB monlogin 'mot-de-passe'
# (bcrypt, -B). La valeur venant de .env, ses "$" n'ont PAS à être doublés,
# contrairement à un htpasswd écrit en dur dans un label.

services:
  iozycore-api:
    build: .
    image: iozycore-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iozycore}
      DB_USER: ${DB_USER:-iozycore}
      DB_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
      BGG_APPLICATION_TOKEN: ${BGG_APPLICATION_TOKEN:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_BACKUP_API_KEYS: ${GOOGLE_BOOKS_BACKUP_API_KEYS:-}
      # Doit correspondre au domaine du service "web" ci-dessous - requis
      # même si nginx proxy /api en apparence "same-origin" pour le
      # navigateur : les requêtes POST/PATCH/DELETE envoient toujours un
      # header Origin, que Spring vérifie (voir api/config/CorsConfig.java).
      # Guillemets OBLIGATOIRES : le message d'erreur contient "ex: https://..."
      # et un ": " dans un scalaire nu fait lire une imbrication à YAML - sans
      # eux, tout le fichier est invalide et `docker compose` refuse de le
      # charger ("mapping values are not allowed in this context", trouvé au
      # Lot 27 en validant le fichier pour la première fois).
      WEB_ALLOWED_ORIGINS: "${WEB_ALLOWED_ORIGINS:?erreur - définir WEB_ALLOWED_ORIGINS dans .env (ex: https://app.iozycore.mondomaine.tld)}"
    volumes:
      - media_data:/app/media
    networks:
      - internal
      - proxy
    labels:
      # Labels Traefik : routage HTTPS automatique avec Let's Encrypt.
      # Remplacer iozycore.mondomaine.tld par ton propre domaine/DDNS Synology.
      - "traefik.enable=true"
      # Middleware d'authentification, défini une fois ici et réutilisé par le
      # service web ci-dessous (voir l'en-tête du fichier).
      - "traefik.http.middlewares.iozycore-auth.basicauth.users=${BASIC_AUTH_USERS:?erreur - définir BASIC_AUTH_USERS dans .env (format htpasswd, voir l'en-tête de ce fichier)}"
      # Sous-domaine API : tout est authentifié...
      - "traefik.http.routers.iozycore.rule=Host(`iozycore.mondomaine.tld`)"
      - "traefik.http.routers.iozycore.entrypoints=websecure"
      - "traefik.http.routers.iozycore.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iozycore.middlewares=iozycore-auth@docker"
      # ...sauf les deux endpoints de partage, dont le jeton EST le mot de
      # passe. Priorité explicite : ce routeur doit gagner sur celui ci-dessus,
      # qui couvre le même hôte.
      - "traefik.http.routers.iozycore-public.rule=Host(`iozycore.mondomaine.tld`) && PathPrefix(`/api/public`)"
      - "traefik.http.routers.iozycore-public.priority=100"
      - "traefik.http.routers.iozycore-public.entrypoints=websecure"
      - "traefik.http.routers.iozycore-public.tls.certresolver=letsencrypt"
      - "traefik.http.services.iozycore.loadbalancer.server.port=8080"

  web:
    build: ../web
    image: iozycore-web:latest
    restart: unless-stopped
    depends_on:
      - iozycore-api
    networks:
      - internal   # pour joindre iozycore-api via le proxy nginx interne (voir web/nginx.conf)
      - proxy      # pour être routable par Traefik
    labels:
      # Sous-domaine séparé de l'API (iozycore.mondomaine.tld reste dédié à
      # l'iOS/Swagger/accès direct) - nginx proxy /api en interne vers
      # iozycore-api. Ce domaine doit être répété dans WEB_ALLOWED_ORIGINS
      # (service iozycore-api ci-dessus) : nginx rend la lecture "same-origin"
      # pour le navigateur, mais les requêtes d'écriture (POST/PATCH/DELETE)
      # envoient quand même un header Origin que Spring vérifie.
      - "traefik.enable=true"
      # L'app entière derrière l'authentification : le navigateur demande les
      # identifiants une fois, puis les renvoie seul sur les appels /api que
      # nginx proxifie en interne (même origine).
      - "traefik.http.routers.iozycore-web.rule=Host(`app.iozycore.mondomaine.tld`)"
      - "traefik.http.routers.iozycore-web.entrypoints=websecure"
      - "traefik.http.routers.iozycore-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.iozycore-web.middlewares=iozycore-auth@docker"
      # Exception : les deux écrans de partage et ce dont ils ont besoin pour
      # s'afficher. /assets/* est le bundle Vite - il ne contient aucune
      # donnée, seulement le code de l'app, et sans lui la page partagée reste
      # blanche. Un visiteur sans identifiants n'obtient donc rien d'autre que
      # ce que son jeton lui ouvre.
      - "traefik.http.routers.iozycore-web-public.rule=Host(`app.iozycore.mondomaine.tld`) && (PathPrefix(`/public`) || PathPrefix(`/assets`) || PathPrefix(`/api/public`))"
      - "traefik.http.routers.iozycore-web-public.priority=100"
      - "traefik.http.routers.iozycore-web-public.entrypoints=websecure"
      - "traefik.http.routers.iozycore-web-public.tls.certresolver=letsencrypt"
      - "traefik.http.services.iozycore-web.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iozycore}
      POSTGRES_USER: ${DB_USER:-iozycore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?erreur - définir DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iozycore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de port exposé publiquement : uniquement accessible depuis
    # le réseau interne "internal" par iozycore-api.

  reverse-proxy:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?erreur - définir ACME_EMAIL dans .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - proxy

networks:
  internal:
  proxy:

volumes:
  postgres_data:
  media_data:
  letsencrypt_data:
