version: "3.9"

# Compose de DÉVELOPPEMENT LOCAL : lance l'API, PostgreSQL et le build de
# prod de l'app web, exposés directement sur localhost, sans reverse proxy
# ni HTTPS. Pour développer l'app web avec rechargement à chaud, préférer
# `npm run dev` dans web/ (voir web/README.md) plutôt que ce service "web"
# qui sert un build statique. Pour le déploiement réel sur le NAS Synology,
# utiliser docker-compose.synology.yml (avec Traefik + Let's Encrypt).
#
# Démarrage : docker compose up --build
# API disponible sur  http://localhost:8080
# Swagger UI sur       http://localhost:8080/swagger-ui.html
# App web sur          http://localhost:8081

services:
  iozycore-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iozycore
      DB_USER: iozycore
      DB_PASSWORD: iozycore_dev
      # Optionnel - voir .env.example. Sans token, les appels BGG restent
      # fonctionnels pour tester en local mais ne sont pas conformes aux
      # conditions actuelles de BGG (voir README, section "Statistiques").
      BGG_APPLICATION_TOKEN: ${BGG_APPLICATION_TOKEN:-}
      # Optionnel - voir .env.example. Sans identifiants, recherche et
      # découverte jeux vidéo renvoient une liste vide (IGDB n'a pas de
      # mode dégradé, contrairement à BGG).
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      # Optionnel - voir .env.example. Complète Jikan pour la recherche
      # manga (relais quand MyAnimeList bloque Jikan) ; sans Client ID,
      # Jikan reste seul comme avant, comportement inchangé.
      MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
      # Optionnel - voir .env.example. Sans clé, appels Google Books
      # fonctionnels mais sur le quota anonyme partagé (429 fréquents).
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      # Optionnel, séparées par des virgules - voir .env.example. Clé(s) de
      # secours (2e projet Google Cloud, quota indépendant) essayée(s) dès
      # que la clé principale répond 429.
      GOOGLE_BOOKS_BACKUP_API_KEYS: ${GOOGLE_BOOKS_BACKUP_API_KEYS:-}
    ports:
      - "8080:8080"
    volumes:
      - media_data:/app/media

  web:
    build: ../web
    restart: unless-stopped
    depends_on:
      - iozycore-api
    ports:
      - "8081:80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iozycore
      POSTGRES_USER: iozycore
      POSTGRES_PASSWORD: iozycore_dev
    ports:
      - "5432:5432"   # exposé en local uniquement, pratique pour un client SQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iozycore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media_data:
