spring:
  application:
    name: iozycore
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iozycore}
    username: ${DB_USER:iozycore}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate   # le schéma est piloté par Flyway, jamais par Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

web:
  # Origines autorisées pour les requêtes POST/PATCH/DELETE du client web
  # (voir api/config/CorsConfig.java pour le pourquoi - même en usage
  # nginx-proxied "same-origin", ces méthodes envoient un header Origin
  # que Spring vérifie). CSV, valeurs par défaut = dev Vite (:5173) +
  # build Docker local (:8081). En Synology, définir avec le vrai domaine
  # du service web.
  allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

bgg:
  # Requis par BGG depuis juillet 2025 pour la quasi-totalité de son API XML
  # (voir boardgamegeek.com/using_the_xml_api) - enregistrer une application
  # sur boardgamegeek.com/applications, puis renseigner le token ici.
  # Laissé vide, les appels BGG restent fonctionnels pour le développement
  # local mais ne sont pas conformes aux conditions actuelles de BGG.
  application-token: ${BGG_APPLICATION_TOKEN:}

igdb:
  # Identifiants Twitch Developer Console (flux OAuth2 client-credentials) -
  # voir README.md, section "Obtenir et configurer des identifiants
  # IGDB/Twitch". Contrairement à BGG, IGDB ne fonctionne pas du tout sans
  # ces identifiants (pas de mode dégradé/anonyme) : recherche et
  # découverte jeux vidéo renvoient une liste vide tant qu'ils sont absents.
  client-id: ${IGDB_CLIENT_ID:}
  client-secret: ${IGDB_CLIENT_SECRET:}

mal:
  # Client ID MyAnimeList (API officielle v2, pas de flux OAuth complet
  # requis pour la recherche publique) - voir README.md, section "Obtenir
  # et configurer un Client ID MyAnimeList". Complète Jikan pour le type
  # MANGA (jamais à sa place) : sans Client ID configuré, ce fournisseur
  # reste simplement absent et Jikan continue de fonctionner seul comme
  # avant. Utile quand Jikan est indisponible (MyAnimeList bloque/throttle
  # ce wrapper tiers par intermittence, contrairement à l'API officielle).
  client-id: ${MAL_CLIENT_ID:}

google-books:
  # Clé API Google Books (console.cloud.google.com, API "Books API" activée) -
  # optionnelle : sans clé, les appels restent fonctionnels mais partagent le
  # quota anonyme mondial (429 "Quota exceeded" fréquents en pratique). Une
  # clé donne un quota dédié à ce projet. Utilisée par les 4 fournisseurs
  # Google Books via GoogleBooksHttpClient (scan ISBN, titre français par
  # résolution/direct, recherche de tomes).
  api-key: ${GOOGLE_BOOKS_API_KEY:}
  # Clé(s) de secours, séparées par des virgules (ex: "cle2,cle3") - un 2e
  # projet Google Cloud avec sa propre clé "Books API" a son propre quota
  # journalier indépendant : GoogleBooksHttpClient bascule dessus dès que la
  # clé principale répond 429, avant d'abandonner. Vérifié manuellement
  # (voir historique) : une session de tests intensifs épuise le quota par
  # défaut d'une seule clé en quelques dizaines de recherches de tomes (8
  # requêtes chacune).
  backup-api-keys: ${GOOGLE_BOOKS_BACKUP_API_KEYS:}

openai:
  # Clé API OpenAI (platform.openai.com, pas un abonnement ChatGPT Plus) -
  # optionnelle : sans clé, l'assistance IA de l'analyse d'achat (fiches
  # d'édition auto-remplies, estimation de prix) reste simplement absente,
  # même adaptateur auto-désactivé que BGG/IGDB. Voir PurchaseAnalysisAiProvider.
  api-key: ${OPENAI_API_KEY:}
