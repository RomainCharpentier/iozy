# Exécution parallèle des classes de test.
#
# Pourquoi. Une fois le conteneur Postgres et le contexte Spring partagés (voir
# PostgresIntegrationTest), la suite ne coûte presque plus que la CONSTRUCTION
# des contextes : quatre classes en portent 73 s sur 80, tout le reste passe
# sous la seconde. Ces quatre-là ne s'attendent pas l'une l'autre - les faire
# démarrer en parallèle est le seul levier qui reste.
#
# Le grain. « concurrent » au niveau des CLASSES, « same_thread » à l'intérieur :
# deux méthodes d'une même classe ne tournent jamais ensemble. On parallélise
# des contextes qui s'initialisent, pas des assertions qui se marchent dessus.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Plafond volontairement bas. Chaque contexte Spring simultané tient sa part de
# mémoire et son pool de connexions vers l'UNIQUE Postgres ; au-delà on
# échangerait de l'attente contre de la contention.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4

# Ce que cela exige des tests, et qui n'est pas négociable :
#   - chaque méthode reste isolée par @Transactional, annulée en fin de méthode ;
#   - une classe qui compte des lignes compte un ÉCART (avant/après), jamais un
#     total absolu - une classe voisine peut avoir inséré entre-temps ;
#   - aucun état statique mutable partagé entre classes de test.
# Une classe qui ne pourrait pas tenir ces règles se marque @Execution(SAME_THREAD).
