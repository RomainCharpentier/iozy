name: Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job pour builder et tester
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck, then vite)
        run: npm run build

      - name: Run server tests
        run: npm test

      - name: Run unit tests
        run: npm run test:unit

  # L'image IozyPlay sur GHCR, à chaque push sur main : c'est elle que la pile
  # Docker d'IozyCore (NAS) tire pour servir IozyPlay sous /play, derrière le
  # même nginx (voir backend/docker-compose.nas.yml dans le dépôt iozycore).
  # `latest` est ce que Watchtower suit ; la version du paquet permet de
  # revenir en arrière à la main.
  publier-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version du paquet
        id: version
        run: |
          numero=$(node -p "require('./package.json').version")
          [ -n "$numero" ] || { echo "Version vide" >&2; exit 1; }
          echo "numero=$numero" >> "$GITHUB_OUTPUT"

      # GHCR exige des minuscules, `RomainCharpentier` n'en est pas.
      - name: Propriétaire en minuscules
        id: depot
        run: echo "nom=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.depot.outputs.nom }}/iozyplay:latest
            ghcr.io/${{ steps.depot.outputs.nom }}/iozyplay:v${{ steps.version.outputs.numero }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job pour déployer le frontend (si push sur main)
  # Note: Netlify déploie automatiquement depuis Git, ce job est optionnel
  # Il peut être utilisé pour des déploiements plus avancés
  deploy-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Décommentez ce job si vous voulez utiliser GitHub Actions pour déployer
    # Sinon, laissez Netlify gérer le déploiement automatique depuis Git
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://your-backend.onrender.com' }}

      # Optionnel: Déployer via GitHub Actions (si vous avez configuré les secrets)
      # - name: Deploy to Netlify
      #   uses: netlify/actions/cli@master
      #   with:
      #     args: deploy --dir=dist --prod
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # Job pour notifier le backend (déploiement manuel ou via webhook)
  notify-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger backend redeploy
        run: |
          echo "Backend should auto-deploy from Git connection"
          echo "If using Railway/Render, they will detect the push automatically"

