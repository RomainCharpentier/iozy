<!doctype html>
<!-- `dark-theme` d'emblée : le défaut de l'app est sombre alors que la charte
     (IozyKit) pose le clair sur :root ; settingsService ajuste ensuite. -->
<html lang="fr" class="dark-theme">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Couleur de la barre système, posée AVANT le premier octet de CSS.
         Deux déclarations : l'app a deux thèmes, le navigateur prend la première qui correspond. -->
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf6f2" media="(prefers-color-scheme: light)" />
    <meta name="description" content="IozyPlay — le blindtest multijoueur. Devine les chansons, séries TV, animes, films et jeux vidéo !" />
    <meta name="keywords" content="iozyplay, blindtest, quiz, musique, séries, animes, films, jeux vidéo, multijoueur" />
    <meta name="author" content="IozyPlay" />
    <meta property="og:title" content="IozyPlay — le blindtest multijoueur" />
    <meta property="og:description" content="Devine les chansons, séries TV, animes, films et jeux vidéo !" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>IozyPlay</title>
    <script>
      // Désinscrire immédiatement le service worker en développement pour éviter le cache
      // Ce script s'exécute AVANT que le service worker n'intercepte les requêtes
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.includes('localhost')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(cacheNames) {
              cacheNames.forEach(function(cacheName) {
                caches.delete(cacheName);
              });
            });
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
